version: 2
jobs:
  build:
    docker:
      - image: circleci/python:3.6.2-browsers
        environment:
          APP_CONFIG_FILE: ~/project/app/config/test.py
          DATABASE_URL: postgres://test:@db:5432/feature_requests_dev
          DATABASE_TEST_URL: postgres://test:@db:5432/feature_requests_test
          DISPLAY: :99
          CHROME_BIN: /usr/bin/google-chrome
      - image: circleci/postgres:latest
        environment:
          APP_CONFIG_FILE: ~/project/app/config/test.py
          DATABASE_URL: postgres://test:@db:5432/feature_requests_dev
          DATABASE_TEST_URL: postgres://test:@db:5432/feature_requests_test
      - image: circleci/node:latest
        environment:
          TEST_URL: http://127.0.0.1
      - image: nginx:1.13.0

    working_directory: ~/project

    steps:
      - checkout

      - setup-remote_docker

      - run:
          name: Install Docker Compose
          command: |
            curl -L https://github.com/docker/compose/releases/download/1.11.2/docker-compose-`uname -s`-`uname -m` > ~/docker-compose
            chmod +x ~/docker-compose
            sudo mv ~/docker-compose /usr/local/bin/docker-compose

      - run:
          name: Start container and verify it is working
          command: |
            docker-compose -f docker-compose-test.yml up -d --build
            docker-compose -f docker-compose-test.yml run api python manage.py db upgrade
            docker-compose -f docker-compose-test.yml ps

      - run:
          name: Run tests
          command: |
            sh test.sh

      - store_artifacts:
          path: test-reports
          destination: test-reports

      - store_test_results:
          path: /tmp/test-results
